[package]
name = "roomvana"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust client for the Roomvana AI interior design catalog and design links"
license = "MIT"
readme = "README.md"
homepage = "https://roomvana.ai"
repository = "https://github.com/TJLDC/roomvana-rs"
documentation = "https://docs.rs/roomvana"
keywords = ["interior-design", "ai", "home-decor", "catalog", "api-client"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
